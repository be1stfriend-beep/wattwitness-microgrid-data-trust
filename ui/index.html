<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WattWitness · telemetry review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C27C0E'/%3E%3Cpolyline points='4,8 8,17 12,9 16,17 20,8' fill='none' stroke='%2310212E' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F5F3EE; --surface: #FFFFFF; --surface-2: #EFEBE3; --line: #E3DDD2; --line-2: #CFC7B8;
  --ink: #10212E; --ink-2: #33424E; --muted: #5F6C77; --faint: #8F99A2;
  --accent: #C27C0E; --accent-ink: #855000; --accent-bg: #FBF0DA;
  --bad: #B23A12; --bad-bg: #FBE8DF; --gap: #475563; --gap-bg: #E7EBEF;
  --rule: #8A5A00; --rule-bg: #FBF1D8; --event: #22579F; --event-bg: #E2EBF7;
  --ok: #0E6B63; --ok-bg: #DFF0EC;
  --r-sm: 6px; --r-md: 10px;
  --f-display: 'Space Grotesk', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --top: 60px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.01em; margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 24px; padding: 0 20px;
  color: #E8EEF2; background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 32px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 32px), var(--ink); }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand b { font: 700 19px var(--f-display); letter-spacing: -0.02em; color: #fff; }
.brand small { color: #93A3B0; font-size: 12px; border-left: 1px solid #33485A; padding-left: 10px; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tabs button { background: none; border: 0; padding: 0 12px; height: 100%; color: #A9B7C2; font-weight: 500; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
.tabs button:hover { color: #fff; }
.controls { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.seg { display: flex; background: rgba(255,255,255,.07); border: 1px solid #2C4253; border-radius: var(--r-sm); padding: 2px; }
.seg button { border: 0; background: none; color: #B5C2CC; padding: 5px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--ink); }
.switch { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C5D0D8; cursor: pointer; white-space: nowrap; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: #33485A; position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #E8EEF2; transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* ---------- status strip ---------- */
.strip { display: flex; align-items: center; gap: 20px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }
.strip strong { color: var(--ink); }
.progress { flex: 0 0 180px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
.truthnote { margin-left: auto; color: var(--accent-ink); background: var(--accent-bg); padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; }

/* ---------- review layout ---------- */
.review { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - var(--top) - 45px); }
.inbox { border-right: 1px solid var(--line); background: #FAF8F4; display: flex; flex-direction: column; min-height: 0; }
.filters { padding: 12px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11.5px; opacity: .75; }
.chip .dot, .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.list { overflow-y: auto; flex: 1; padding: 4px 0 16px; }
.day { position: sticky; top: 0; background: #FAF8F4; padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; z-index: 1; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: calc(100% - 16px); margin: 2px 8px; padding: 9px 10px 9px 12px; text-align: left;
  background: none; border: 1px solid transparent; border-left: 3px solid var(--k, var(--line-2)); border-radius: var(--r-sm); }
.item:hover { background: var(--surface); border-color: var(--line); border-left-color: var(--k); }
.item[aria-current="true"] { background: var(--surface); border-color: var(--line-2); border-left-color: var(--k); box-shadow: 0 1px 0 rgba(16,33,46,.04); }
.item .h { font-weight: 500; font-size: 13.5px; line-height: 1.35; color: var(--ink); }
.item .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.item .s { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.item .done { color: var(--ok); font-weight: 500; }
.meter { width: 34px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--ink-2); }

.case { overflow-y: auto; padding: 22px 28px 0; min-width: 0; }
.case-in { max-width: 1080px; margin: 0 auto; animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.case-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.when { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
.k-bad { --k: var(--bad); --kb: var(--bad-bg); } .k-gap { --k: var(--gap); --kb: var(--gap-bg); }
.k-rule { --k: var(--accent); --kb: var(--rule-bg); } .k-event { --k: var(--event); --kb: var(--event-bg); }
.badge.kind { background: var(--kb); color: var(--k); }
.badge.k-rule { color: var(--rule); }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.truth { background: var(--accent-bg); color: var(--accent-ink); }
.pager { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.pager button { width: 32px; height: 32px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); display: grid; place-items: center; }
.pager button:disabled { opacity: .4; cursor: default; }
.headline { font-size: 28px; line-height: 1.2; margin: 16px 0 8px; font-weight: 600; }
.sentence { font-size: 16.5px; color: var(--ink-2); max-width: 820px; margin: 0 0 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px; margin-bottom: 16px; }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panel h2 { font-size: 16px; font-weight: 600; }
.panel h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .05em; font-family: var(--f-body); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.band { height: 10px; border: 0; background: rgba(14,107,99,.16); }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.grid2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 11px var(--f-mono); fill: var(--faint); }
.mini-title { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin: 10px 0 2px; display: flex; justify-content: space-between; }

/* checks */
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 22px 1fr 150px; align-items: center; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.checks li:first-child { border-top: 0; }
.checks .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.checks .pass .ic { background: var(--ok-bg); color: var(--ok); } .checks .fail .ic { background: var(--bad-bg); color: var(--bad); }
.checks .na .ic { background: var(--gap-bg); color: var(--gap); }
.checks .nm { font-weight: 500; } .checks .vv { font-size: 12px; color: var(--muted); grid-column: 2; }
.track { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; grid-row: 1 / span 2; grid-column: 3; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--ok); }
.fail .track i { background: var(--bad); }
.track b { position: absolute; left: 33.3%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.track em { position: absolute; right: 0; top: -18px; font: 600 11.5px var(--f-mono); color: var(--bad); font-style: normal; }
.scale { display: grid; grid-template-columns: 22px 1fr 150px; gap: 10px; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.scale span:last-child { display: flex; justify-content: space-between; }

/* decision */
.decide { position: sticky; bottom: 0; margin-bottom: 0; border-radius: var(--r-md) var(--r-md) 0 0; box-shadow: 0 -6px 18px rgba(16,33,46,.06); }
.dgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.dbtn { text-align: left; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 8px 12px; display: grid; gap: 2px; position: relative; transition: border-color .12s, background .12s; }
.dbtn:hover { border-color: var(--dc); background: var(--db); }
.dbtn strong { font-size: 14px; color: var(--dc); font-weight: 600; padding-right: 22px; }
.dbtn span { font-size: 12.5px; color: var(--muted); }
.dbtn kbd { position: absolute; top: 9px; right: 10px; font: 500 11px var(--f-mono); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface); }
.dbtn[aria-pressed="true"] { border-color: var(--dc); background: var(--db); box-shadow: inset 0 0 0 1px var(--dc); }
.d0 { --dc: var(--bad); --db: var(--bad-bg); } .d1 { --dc: var(--event); --db: var(--event-bg); }
.d2 { --dc: var(--accent-ink); --db: var(--accent-bg); } .d3 { --dc: var(--gap); --db: var(--gap-bg); }
.dmeta { display: grid; grid-template-columns: 1fr 200px; gap: 8px; margin-top: 10px; }
.dmeta input { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; background: var(--paper); font-size: 13.5px; }
.decided { font-size: 13px; color: var(--ok); margin: 8px 0 0; }

/* ---------- other tabs ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 24px 28px 48px; }
.page > h1 { font-size: 26px; margin-bottom: 6px; }
.lead { color: var(--ink-2); font-size: 16px; max-width: 860px; margin: 0 0 20px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.kpi .v { font: 600 30px var(--f-display); letter-spacing: -0.02em; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .s { font-size: 12px; color: var(--faint); margin-top: 2px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 5px 10px; font-size: 13px; }
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: center; }
.bar-row .nm { font-size: 14px; font-weight: 500; }
.bar-row.sel .nm::after { content: 'selected'; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent-bg); padding: 1px 7px; border-radius: 999px; vertical-align: 1px; }
.bar-set { display: grid; gap: 3px; }
.bar { display: grid; grid-template-columns: 64px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar .tr { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 4px; }
.ev-grid { display: grid; grid-template-columns: 150px repeat(3, 1fr); gap: 6px; font-size: 13px; }
.ev-grid .hd { font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 4px; }
.ev-grid .ft { font-weight: 500; align-self: center; }
.ev { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; background: var(--paper); display: grid; gap: 2px; }
.ev .st { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.ev .sv { font-size: 12px; color: var(--muted); }
.full .st { color: var(--ok); } .part .st { color: var(--accent-ink); } .miss .st { color: var(--bad); }
.heat svg rect.c { cursor: pointer; }
.heat svg rect.c:hover { stroke: var(--ink); stroke-width: 1.5; }
.goal { display: grid; grid-template-columns: 300px 1fr 130px; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.goal:first-of-type { border-top: 0; }
.goal h3 { font: 600 15px var(--f-display); text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; } .goal p { margin: 0; font-size: 14px; color: var(--ink-2); } .goal small { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.step b { font: 600 13px var(--f-mono); color: var(--accent-ink); }
.step h3 { font-size: 15px; margin: 4px 0; }
.step p { margin: 0; font-size: 14px; color: var(--ink-2); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.keys kbd { font: 500 12px var(--f-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--surface); }
ul.plain { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; } ul.plain li { margin: 4px 0; }

/* ---------- feedback ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r-sm); font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.tip { position: fixed; pointer-events: none; z-index: 60; background: var(--ink); color: #fff; border-radius: var(--r-sm); padding: 7px 10px; font-size: 12px; line-height: 1.45; display: none; max-width: 260px; }
.tip .tt { font-family: var(--f-mono); color: #A9B7C2; margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.state { padding: 48px 24px; text-align: center; color: var(--muted); }
.state h2 { color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.state code { font-family: var(--f-mono); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; color: var(--ink); }
.skel { height: 54px; margin: 8px 12px; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--surface-2), #F7F4EE, var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } .dgrid { grid-template-columns: repeat(2, 1fr); } .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 900px) {
  :root { --top: auto; }
  .top { height: auto; flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
  .tabs { order: 3; width: 100%; height: 38px; overflow-x: auto; }
  .controls { margin-left: 0; flex-wrap: wrap; }
  .review { grid-template-columns: 1fr; height: auto; }
  .inbox { max-height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .case { padding: 16px 14px 0; overflow: visible; }
  .decide { position: static; border-radius: var(--r-md); margin-bottom: 16px; box-shadow: none; }
  .headline { font-size: 22px; }
  .dmeta, .bar-row, .goal, .steps { grid-template-columns: 1fr; }
  .ev-grid { grid-template-columns: 1fr; } .ev-grid .hd { display: none; }
  .page { padding: 18px 14px 40px; }
}
@media (max-width: 480px) { .dgrid, .kpis { grid-template-columns: 1fr; } .checks li, .scale { grid-template-columns: 22px 1fr 96px; } .brand small { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#C27C0E"/><polyline points="4,8 8,17 12,9 16,17 20,8" fill="none" stroke="#10212E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <b>WattWitness</b><small>telemetry review</small>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="review" aria-selected="true">Review</button>
    <button role="tab" data-tab="overview" aria-selected="false">Overview</button>
    <button role="tab" data-tab="results" aria-selected="false">Results</button>
    <button role="tab" data-tab="about" aria-selected="false">About</button>
  </nav>
  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Data shown">
      <button role="radio" data-view="fault" aria-checked="true" title="Last 60 days with 18 faults planted in them">Fault replay</button>
      <button role="radio" data-view="clean" aria-checked="false" title="The same 60 days, untouched">Clean window</button>
    </div>
    <label class="switch" title="Reveal which hours really contain a planted fault"><input type="checkbox" id="evalToggle"> Show answers</label>
  </div>
</header>
<div class="strip" id="strip" aria-live="polite"><span>Loading…</span></div>
<main>
  <section id="tab-review" class="review" role="tabpanel" aria-label="Review">
    <aside class="inbox" aria-label="Flagged hours">
      <div class="filters" id="filters"></div>
      <div class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    </aside>
    <article class="case" id="case"></article>
  </section>
  <section id="tab-overview" class="page" role="tabpanel" aria-label="Overview" hidden></section>
  <section id="tab-results" class="page" role="tabpanel" aria-label="Results" hidden></section>
  <section id="tab-about" class="page" role="tabpanel" aria-label="About" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" aria-hidden="true"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ state */
const KIND = {
  bad:   { label: 'Bad reading',        color: '#B23A12', icon: '✕', help: 'Related meters disagree beyond normal meter error' },
  gap:   { label: 'Missing data',       color: '#475563', icon: '○', help: 'A device sent no value' },
  rule:  { label: 'Suspicious pattern', color: '#C27C0E', icon: '!', help: 'A glitch or stuck pattern, but the physics still agrees' },
  event: { label: 'Possible real event', color: '#22579F', icon: '~', help: 'Several flows changed together; may be a genuine change' },
};

    t.innerHTML = `<span>${esc(c)}</span><span class="num">${v == null ? 'no data' : num(v, 1) + ' ' + UNIT(c)}</span>`;
    const box = document.createElement('div'); sp.append(t, box);
    lineChart(box, { x, series: [{ values: d.signals[c].slice(lo, hi + 1), color: C.ink, width: 1.5, label: c, unit: UNIT(c) }], vline: ms(a.t), height: 62, zero: false, aria: c });
    box.querySelectorAll('text').forEach(n => n.remove());
  });
}
async function decide(k) {
  const a = D().alerts.find(x => x.i === S.sel); if (!a) return;
  const reviewer = ($('#reviewer')?.value || '').trim() || 'Demo operator'; store.set('ww-reviewer', reviewer);
  try {
    S.decisions = await api('/api/decisions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ view: S.view, i: a.i, decision: DECISIONS[k][0], notes: $('#note')?.value || '', reviewer }) });
  } catch (e) { toast('Not saved: ' + e.message); return; }
  toast(`Saved: ${DECISIONS[k][0]}. No equipment action was taken.`);
  const dm = decisionMap(), items = visibleAlerts(), pos = Math.max(0, items.findIndex(x => x.i === a.i));
  const next = items.slice(pos + 1).concat(items.slice(0, pos)).find(x => !dm.has(keyOf(x)) && x.i !== a.i);
  renderStrip(); renderFilters();
  if (next) select(next.i); else { renderList(); renderCase(); toast('Every hour in this list has a decision.'); }
}
function pickDefault() {
  const items = visibleAlerts(), dm = decisionMap();
  if (!items.some(a => a.i === S.sel)) S.sel = (items.find(a => !dm.has(keyOf(a))) || items[0] || {}).i ?? null;
}
function renderReview() { renderStrip(); renderFilters(); pickDefault(); renderList(); renderCase(); }

/* ------------------------------------------------------------------ overview */
function renderOverview() {
  const d = D(), s = S.meta.summary, sel = S.meta.evaluation_metrics.find(m => /selected/.test(m.detector));
  const rate = S.meta.untouched_test_alarm_rates.find(m => /selected/.test(m.detector));
  const strong = d.alerts.filter(a => a.score >= 0.8).length, dm = decisionMap();
  const pending = d.alerts.filter(a => !dm.has(keyOf(a))).length, weeks = Math.ceil(d.t.length / 168);
  S.week = Math.min(S.week, weeks - 1);
  const kpi = (v, l, sub) => `<div class="kpi"><div class="v num">${v}</div><div class="l">${l}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  $('#tab-overview').innerHTML = `
    <h1>${VIEW_LABEL[S.view]} at a glance</h1>
    <p class="lead">${S.view === 'fault' ? `Eighteen faults were planted in the last 60 days of telemetry. WattWitness flagged <b>${d.alerts.length}</b> hours; each one is waiting for a human decision.`
      : `The same 60 days with nothing planted. Only <b>${d.alerts.length}</b> hours are flagged — real telemetry gaps and borderline meter readings.`}</p>
    <div class="kpis">${kpi(d.alerts.length, 'Flagged hours', `of ${d.t.length.toLocaleString()} hours`)}${kpi(pending, 'Awaiting review', `${d.alerts.length - pending} decided`)}
      ${kpi(strong, 'Strong evidence', 'score 0.80 or more')}
      ${S.view === 'fault' ? kpi(sel.f1.toFixed(3), 'F1 on planted faults', `precision ${sel.precision.toFixed(3)} · recall ${sel.recall.toFixed(3)}`)
        : kpi(rate.alarm_rate_pct.toFixed(2) + '%', 'Alert rate on clean hours', `training period ${s.training_alert_rate_pct.toFixed(2)}%`)}</div>
    <section class="panel heat"><header><h2>When the flags happened</h2><div class="legend">${Object.entries(KIND).map(([k, v]) => `<span><i class="dot" style="background:${v.color}"></i>${v.label}</span>`).join('')}
      ${S.eval && S.view === 'fault' ? '<span><i class="dot" style="background:none;border:2px solid #C27C0E"></i>planted fault</span>' : ''}</div></header>
      <div id="heat"></div><p class="hint">One column per day, one row per hour. Click a coloured square to open that hour in Review.</p></section>
    <section class="panel"><header><h2>Readings, week ${S.week + 1} of ${weeks}</h2>
      <div class="toolbar"><button class="btn" data-week="-1" ${S.week === 0 ? 'disabled' : ''} aria-label="Previous week">‹ Previous</button><button class="btn" data-week="1" ${S.week >= weeks - 1 ? 'disabled' : ''} aria-label="Next week">Next ›</button></div></header>
      <div class="toolbar" style="margin-bottom:10px">${['PV Power', 'Wind Power', 'Building Load', 'Grid Power', 'Battery Power', 'Battery SOC'].map(c =>
        `<button class="chip" data-signal="${c}" aria-pressed="${S.signals.includes(c)}">${c}</button>`).join('')}</div>
      <div id="weekChart"></div><p class="hint">Red dots mark flagged hours. Hover to read values.</p></section>`;
  drawHeat(); drawWeek();
}
function drawHeat() {
  const d = D(), el = $('#heat'), W = Math.max(320, el.clientWidth), days = Math.ceil(d.t.length / 24), l = 34, top = 4;
  const cw = (W - l - 4) / days, chh = Math.max(7, Math.min(12, cw)), H = top + 24 * chh + 22;
  const byI = new Map(d.alerts.map(a => [a.i, a])), t0 = new Date(d.t[0]);
  const planted = S.eval && S.view === 'fault' && S.truth ? new Set(S.truth.fault_type.map((f, i) => f !== 'none' ? i : -1)) : new Set();
  let g = '';
  [0, 6, 12, 18].forEach(h => { g += `<text x="${l - 6}" y="${top + h * chh + chh * 0.8}" text-anchor="end">${pad(h)}h</text>`; });
  for (let i = 0; i < d.t.length; i++) {
    const day = Math.floor(i / 24), hr = new Date(d.t[i]).getHours(), a = byI.get(i), x = l + day * cw, y = top + hr * chh;
    const fill = a ? KIND[a.kind].color : '#EFEBE3';
    g += `<rect ${a ? `class="c" data-i="${i}"` : ''} x="${x + 0.5}" y="${y + 0.5}" width="${Math.max(1, cw - 1)}" height="${chh - 1}" rx="1.5" fill="${fill}" ${planted.has(i) ? 'stroke="#C27C0E" stroke-width="1.6"' : ''}>${a ? `<title>${fmtShort(d.t[i])} — ${esc(a.headline)}</title>` : ''}</rect>`;
    if (hr === 0 && day % 7 === 0) g += `<text x="${x}" y="${H - 6}">${MONTHS[new Date(d.t[i]).getMonth()]} ${new Date(d.t[i]).getDate()}</text>`;
  }
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Flagged hours by day and hour">${g}</svg></div>`;
  void t0;
}
function drawWeek() {
  const d = D(), lo = S.week * 168, hi = Math.min(d.t.length - 1, lo + 167), x = d.t.slice(lo, hi + 1).map(ms);
  const flagged = new Set(d.alerts.map(a => a.i));
  const series = S.signals.map((c, k) => ({ values: d.signals[c].slice(lo, hi + 1), color: C.series[k % C.series.length], width: 1.6, label: c, unit: UNIT(c) }));
  if (!series.length) { $('#weekChart').innerHTML = '<div class="state">Pick at least one reading above.</div>'; return; }
  const marks = x.map((_, k) => k).filter(k => flagged.has(lo + k));
  lineChart($('#weekChart'), { x, series, marks, height: 300, shades: truthShades(x, lo, hi), aria: 'Readings for the selected week' });
  $('#weekChart').insertAdjacentHTML('afterbegin', `<div class="legend" style="margin-bottom:6px">${series.map(s => `<span><i class="sw" style="border-color:${s.color}"></i>${esc(s.label)} (${s.unit})</span>`).join('')}</div>`);
}

/* ------------------------------------------------------------------ results */
function renderResults() {
  const M = S.meta, s = M.summary, sel = M.evaluation_metrics.find(m => /selected/.test(m.detector));
  const rate = M.untouched_test_alarm_rates.find(m => /selected/.test(m.detector));
  const ev = M.event_level_results, full = ev.filter(e => e.fully_detected).length, any = ev.filter(e => e.detected).length;
  const bars = M.evaluation_metrics.map(m => `<div class="bar-row ${/selected/.test(m.detector) ? 'sel' : ''}"><div class="nm">${esc(m.detector.replace(' (selected)', ''))}</div><div class="bar-set">
      ${[['Precision', m.precision, '#10212E'], ['Recall', m.recall, '#C27C0E'], ['F1', m.f1, '#0E6B63']].map(([l, v, c]) =>
        `<div class="bar"><span>${l}</span><span class="tr"><i style="width:${v * 100}%;background:${c}"></i></span><span class="num">${v.toFixed(3)}</span></div>`).join('')}</div></div>`).join('');
  const types = ['spike', 'frozen', 'gradual_drift', 'missing', 'delayed_signal', 'plausible_bias'];
  const names = { spike: 'Spike', frozen: 'Frozen sensor', gradual_drift: 'Gradual drift', missing: 'Missing values', delayed_signal: 'Delayed / replayed', plausible_bias: 'Plausible bias' };
  let grid = `<div class="hd"></div><div class="hd">Round 1 · gross</div><div class="hd">Round 2</div><div class="hd">Round 3 · subtle</div>`;
  types.forEach(t => {
    grid += `<div class="ft">${names[t]}</div>`;
    ev.filter(e => e.fault_type === t).forEach(e => {
      const cls = e.fully_detected ? 'full' : e.detected ? 'part' : 'miss';
      const st = e.fully_detected ? '● Caught every hour' : e.detected ? '◐ Caught ' + e.flagged_rows + ' of ' + e.altered_rows + ' hours' : '○ Missed';
      grid += `<div class="ev ${cls}"><span class="st">${st}</span><span class="sv">${esc(e.severity.replace(/^single-sample upward spike of /, 'spike ').replace(/^grid-current reading increased by /, 'current +'))}</span>
        <span class="sv">${e.detected ? 'first flag after ' + e.hours_to_first_flag + ' h' : ''}</span></div>`;
    });
  });
  $('#tab-results').innerHTML = `
    <h1>How well does it work?</h1>
    <p class="lead">On the last 60 days, with 18 planted faults and realistic meter error, the selected checks found <b>${sel.tp} of ${sel.tp + sel.fn}</b> altered readings with only <b>${sel.fp}</b> false alarms
      (F1 <b>${sel.f1.toFixed(3)}</b>). Every planted fault was flagged at least once (<b>${any} of ${ev.length}</b>); ${full} were flagged on every affected hour.
      On the untouched copy only <b>${rate.alarm_rate_pct.toFixed(2)}%</b> of hours were flagged, close to the ${s.training_alert_rate_pct.toFixed(2)}% seen in training, so nothing was tuned to the test.</p>
    <section class="panel"><header><h2>Detector comparison</h2><span class="legend">row level, planted faults, 0.5% meter error</span></header><div class="bars">${bars}</div>
      <p class="hint">The statistical model (Isolation Forest) is kept only as a comparison: it finds few faults and adding it lowers precision.</p></section>
    <section class="panel"><header><h2>Every planted fault</h2><span class="legend">spikes and biases get smaller in each round</span></header><div class="ev-grid">${grid}</div>
      <p class="hint">Partial catches are expected: a drift starts at zero and only crosses normal meter error after a few hours; a 5% current bias is only visible when the grid current is high.</p></section>
    <section class="panel"><header><h2>What if the meters were noisier?</h2><span class="legend">fixed 2 kW limits (first version) vs limits learned from training data</span></header>
      <div class="grid2"><div><div class="mini-title"><span>F1 on planted faults</span></div><div id="nf1"></div></div>
        <div><div class="mini-title"><span>Share of clean hours flagged (%)</span></div><div id="nrate"></div></div></div>
      <div class="legend" style="margin-top:6px"><span><i class="sw" style="border-color:#B23A12"></i>fixed limits</span><span><i class="sw" style="border-color:#0E6B63"></i>learned limits</span></div>
      <p class="hint">Fixed limits only work on perfect data: with realistic 0.5% meter error they flag about a fifth of all clean hours. Learned limits keep false alarms near 0.2% and lose subtle faults only gradually.</p></section>`;
  const nz = M.noise_robustness, fx = nz.filter(r => /^fixed/.test(r.thresholds)), lr = nz.filter(r => !/^fixed/.test(r.thresholds));
  const x = lr.map(r => r.power_meter_error_pct), f = v => v + '%';
  lineChart($('#nf1'), { x, xType: 'num', xFmt: f, xLabel: 'meter error (1σ)', height: 220, digits: 3, series: [
    { values: fx.map(r => r.f1), color: '#B23A12', label: 'fixed limits', dots: true }, { values: lr.map(r => r.f1), color: '#0E6B63', label: 'learned limits', dots: true }], aria: 'F1 against meter error' });
  lineChart($('#nrate'), { x, xType: 'num', xFmt: f, xLabel: 'meter error (1σ)', height: 220, digits: 2, series: [
    { values: fx.map(r => r.clean_window_alert_rate_pct), color: '#B23A12', label: 'fixed limits', unit: '%', dots: true }, { values: lr.map(r => r.clean_window_alert_rate_pct), color: '#0E6B63', label: 'learned limits', unit: '%', dots: true }], aria: 'False alarm rate against meter error' });
}

/* ------------------------------------------------------------------ about */
function renderAbout() {
  const goals = [
    ['1 · Anomaly & Bias Detection', 'Working', 'Missing / spike / stuck-value rules plus six physics cross-checks whose limits are learned from training data; six fault types at three severities.', 'No labelled real grid events yet; telling genuine events from bad data needs trusted context.'],
    ['2 · Confidence Scores & Explainability', 'Working', 'Each alert states what disagrees, by how much compared with normal meter error, and how strong the evidence is.', 'The score is a transparent heuristic, not a calibrated probability.'],
    ['3 · Human-AI Escalation & Governance', 'Prototype', 'Every flag waits for a person: confirm, genuine event, escalate or dismiss. Decisions are appended to a log that is never rewritten.', 'No sign-in or secured storage. Nothing is corrected automatically and no equipment is controlled.'],
    ['4 · Shared Learning Across the Noosphere', 'Design only', 'How nodes could share anonymous fault patterns, what stays local, compatibility checks, provenance and poisoning risks (docs/cross_node_design.md).', 'Not built; the challenge allows a documented design in Phase 1.'],
  ];
  $('#tab-about').innerHTML = `
    <h1>What WattWitness does</h1>
    <p class="lead">Every reading is treated as testimony and checked against the physics around it. When meters disagree by more than normal meter error, the hour is flagged, explained in plain words and handed to a person. Nothing is changed automatically.</p>
    <div class="steps">
      <div class="step"><b>01</b><h3>Cross-examine</h3><p>Power balance, voltage × current × power factor and battery current are checked every hour, with limits learned from a year of training data.</p></div>
      <div class="step"><b>02</b><h3>Explain</h3><p>Each flag says which meters disagree, by how much, and how that compares with normal meter error.</p></div>
      <div class="step"><b>03</b><h3>Decide</h3><p>A person confirms, escalates or dismisses. The decision and the reason are kept in an append-only log.</p></div>
    </div>
    <section class="panel" style="margin-top:16px"><header><h2>The four challenge goals</h2></header>
      ${goals.map(([t, st, d, lim]) => `<div class="goal"><h3>${t}</h3><p>${d}<small>${lim}</small></p><span class="badge ${st === 'Design only' ? '' : 'ok'}">${st}</span></div>`).join('')}</section>
    <div class="grid2">
      <section class="panel"><header><h2>Honest limits</h2></header><ul class="plain">
        <li>One simulated node, hourly. Building load, dispatch and voltage/current channels are synthetic; meter error and outages are modelled.</li>
        <li>Faults are planted one channel at a time. A coordinated change of all related meters would pass the physics checks.</li>
        <li>Scores measure performance on planted faults, not on real equipment.</li></ul></section>
      <section class="panel"><header><h2>Keyboard</h2></header><div class="keys">
        <kbd>J</kbd><span>next flagged hour</span><kbd>K</kbd><span>previous flagged hour</span><kbd>1</kbd><span>confirm data issue</span>
        <kbd>2</kbd><span>likely genuine event</span><kbd>3</kbd><span>escalate</span><kbd>4</kbd><span>dismiss</span></div></section>
    </div>`;
}

/* ------------------------------------------------------------------ shell */
function render() {
  document.querySelectorAll('.tabs [role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  document.querySelectorAll('.seg [role=radio]').forEach(b => b.setAttribute('aria-checked', b.dataset.view === S.view));
  ['review', 'overview', 'results', 'about'].forEach(t => { $('#tab-' + t).hidden = t !== S.tab; });
  if (!S.meta || !D()) return;
  ({ review: renderReview, overview: renderOverview, results: renderResults, about: renderAbout })[S.tab]();
  if (S.tab !== 'review') renderStrip();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button, rect.c'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); return; }
  if (b.dataset.view) { S.view = b.dataset.view; store.set('ww-view', S.view); S.sel = null; S.week = 0; render(); return; }
  if (b.dataset.filter) { S.filter = b.dataset.filter; renderReview(); return; }
  if (b.dataset.pending) { S.pending = !S.pending; renderReview(); return; }
  if (b.dataset.i && b.classList.contains('item')) { select(+b.dataset.i); return; }
  if (b.dataset.step) { step(+b.dataset.step); return; }
  if (b.dataset.decide) { decide(+b.dataset.decide); return; }
  if (b.dataset.week) { S.week += +b.dataset.week; renderOverview(); return; }
  if (b.dataset.signal) { const c = b.dataset.signal; S.signals = S.signals.includes(c) ? S.signals.filter(x => x !== c) : S.signals.concat(c); renderOverview(); return; }
  if (b.matches('rect.c')) { S.tab = 'review'; S.filter = 'all'; S.pending = false; S.sel = +b.dataset.i; render(); }
});
document.addEventListener('keydown', e => {
  if (S.tab !== 'review' || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  else if (/^[1-4]$/.test(e.key)) decide(+e.key - 1);
});
$('#evalToggle').addEventListener('change', async e => {
  S.eval = e.target.checked;
  if (S.eval && !S.truth) { try { S.truth = await api('/api/truth'); } catch (err) { toast(err.message); } }
  render();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'review') renderCase(); else render(); }, 150); });

(async function boot() {
  try {
    const [meta, fault, clean, decisions] = await Promise.all(['/api/meta', '/api/view/fault', '/api/view/clean', '/api/decisions'].map(p => api(p)));
    Object.assign(S, { meta, decisions, data: { fault, clean } });
    render();
  } catch (err) {
    $('#strip').innerHTML = '<span>Could not load the detector outputs.</span>';
    $('#tab-review').innerHTML = `<div class="state" style="grid-column:1/-1"><h2>Nothing to review yet</h2><p>${esc(err.message)}</p>
      <p>Run <code>python scripts/run_phase1_pipeline.py</code>, then reload this page.</p></div>`;
  }
})();
</script>
